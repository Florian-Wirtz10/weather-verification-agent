[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-verification-agent"
version = "0.1.0"
description = "Natural-language-driven weather forecast verification agent for precipitation nowcasting."
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies — grown past the phase-1 synthetic-only set now that
# phase 2 reads real 风雷 mosaic (bz2) and radar CREF (NetCDF) products and
# calls out to an LLM for NL parsing.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "netCDF4>=1.6",
    "openai>=1.30",
]

# Dev-only tooling — kept out of the runtime dependency set so a deployed
# environment doesn't pull in test/lint tooling it will never use.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = [
    "agent",
    "verification",
    "data_io",
    "visualization",
    "reports",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
