[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-verification-agent"
version = "0.1.0"
description = "Natural-language-driven weather forecast verification agent for precipitation nowcasting."
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies only — what phase 1 (synthetic arrays, metrics,
# plotting, Streamlit display) actually needs. Add xarray/netCDF4/scipy/
# anthropic/etc. when the code that uses them lands, not before.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

# Dev-only tooling — kept out of the runtime dependency set so a deployed
# environment doesn't pull in test/lint tooling it will never use.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = [
    "agent",
    "verification",
    "data_io",
    "visualization",
    "reports",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
