[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-verification-agent"
version = "0.1.0"
description = "Constrained natural-language agent for auditable nowcast verification."
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies — grown past the phase-1 synthetic-only set now that
# Phase 3 reads real 风雷 mosaic (bz2) and radar CREF (NetCDF) products and
# uses an LLM only for constrained request parsing and evidence-bounded prose.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    # Phase 3 uses width="stretch" and download_button(on_click="ignore").
    "streamlit>=1.59",
    "python-dotenv>=1.0",
    "netCDF4>=1.6",
    "openai>=1.30",
    "Pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
weather-agent-web = "webapi.main:run"

# Dev-only tooling — kept out of the runtime dependency set so a deployed
# environment doesn't pull in test/lint tooling it will never use.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = [
    "agent",
    "verification",
    "data_io",
    "visualization",
    "reports",
    "webapi",
]

[tool.setuptools.package-data]
visualization = ["assets/*.geojson", "assets/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
